<template>
    <lightning-card title="Agent Performance Dashboard" icon-name="standard:user">
        <!-- Show spinner while data is loading -->
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading" size="medium"> </lightning-spinner>
            </div>
        </template>

        <!-- Show error if something went wrong -->
        <template if:true={error}>
            <div class="slds-p-around_medium">
                <p style="color: red">An error occurred loading dashboard data.</p>
            </div>
        </template>

        <!-- Show dashboard stats when data is loaded -->
        <template if:true={stats}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-gutters">
                    <!-- Active Listings Tile -->
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <div class="slds-box slds-p-around_medium">
                            <p class="slds-text-heading_large slds-m-bottom_x-small">{stats.activeListings}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Active Listings</p>
                        </div>
                    </div>

                    <!-- Total Offers Tile -->
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <div class="slds-box slds-p-around_medium">
                            <p class="slds-text-heading_large slds-m-bottom_x-small">{stats.totalOffers}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Total Offers</p>
                        </div>
                    </div>

                    <!-- Commission YTD Tile -->
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <div class="slds-box slds-p-around_medium">
                            <p class="slds-text-heading_large slds-m-bottom_x-small">{formattedCommission}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Commission YTD</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
